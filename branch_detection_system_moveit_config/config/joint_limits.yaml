# These limits are used by MoveIt and augment/override the definitions in ur_description.
#
# While the robot does not inherently have any limits on joint accelerations (only on torques),
# MoveIt needs them for time parametrization. They were chosen conservatively to work in most use
# cases. For specific applications, higher values might lead to better execution performance.

# joint_limits:
#   $(var ur_prefix)shoulder_pan_joint:
#     has_acceleration_limits: true
#     max_acceleration: 5.0
#   $(var ur_prefix)shoulder_lift_joint:
#     has_acceleration_limits: true
#     max_acceleration: 5.0
#   $(var ur_prefix)elbow_joint:
#     has_acceleration_limits: true
#     max_acceleration: 5.0
#   $(var ur_prefix)wrist_1_joint:
#     has_acceleration_limits: true
#     max_acceleration: 5.0
#   $(var ur_prefix)wrist_2_joint:
#     has_acceleration_limits: true
#     max_acceleration: 5.0
#   $(var ur_prefix)wrist_3_joint:
#     has_acceleration_limits: true
#     max_acceleration: 5.0

joint_limits:
  $(var ur_prefix)shoulder_pan_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 2.617993878
    max_position: 6.28318530718 
    max_velocity: 3.14159265359
    min_position: -6.28318530718 
  $(var ur_prefix)shoulder_lift_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 2.617993878
    max_position: 6.28318530718 
    max_velocity: 3.14159265359
    min_position: -6.28318530718 
  $(var ur_prefix)elbow_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 2.617993878
    # we artificially limit this joint to half its actual joint position limit
    # to avoid (MoveIt/OMPL) planning problems, as due to the physical
    # construction of the robot, it's impossible to rotate the 'elbow_joint'
    # over more than approx +- 1 3.14159265359 (the shoulder lift joint gets in the way).
    #
    # This leads to planning problems as the search space will be divided into
    # two sections, with no connections from one to the other.
    #
    # Refer to https://github.com/ros-industrial/universal_robot/issues/265 for
    # more information.
    max_position: 3.14159265359
    max_velocity: 3.14159265359
    min_position: -3.14159265359
  $(var ur_prefix)wrist_1_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 0.4886921906
    max_position: 6.28318530718 
    max_velocity: 3.14159265359
    min_position: -6.28318530718 
  $(var ur_prefix)wrist_2_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 0.4886921906
    max_position: 6.28318530718 
    max_velocity: 3.14159265359
    min_position: -6.28318530718 
  $(var ur_prefix)wrist_3_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 0.4886921906
    max_position: 6.28318530718 
    max_velocity: 3.14159265359
    min_position: -6.28318530718 