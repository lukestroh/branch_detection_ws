[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "box_client"
version = "0.0.1"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Luke Strohbehn", email = "luke.strohbehn@gmail.com" },
]
maintainers = [
    { name = "Luke Strohbehn", email = "luke.strohbehn@gmail.com" },
]
description = "A client for Box API interactions."
requires-python = ">=3.8"
dependencies = [
    "boxsdk",
    "dotenv",
    "numpy",
    "requests",
]